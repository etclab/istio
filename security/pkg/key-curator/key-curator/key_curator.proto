syntax = "proto3";

option go_package = "istio.io/istio/security/pkg/key-curator/key-curator";

import "rbe.proto";
import "google/protobuf/empty.proto";

package keycurator;

service KeyCurator {
    rpc FetchUpdate(UpdateRequest) returns (UserOpeningResponse) {}
    rpc FetchAllUpdates(google.protobuf.Empty) returns (AllUpdatesResponse) {}
    rpc FetchPublicParams(google.protobuf.Empty) returns (PublicParamsResponse) {}
    rpc RegisterUser(RegisterRequest) returns (UserOpeningResponse) {}
    rpc MarkReady(ReadyRequest) returns (google.protobuf.Empty) {}
    rpc StreamRegistrations(StreamRegistrationsRequest) returns (stream RegistrationNotification) {}
}

message ReadyRequest {
    int64 id = 1;
    string prefix = 2;
}

message Empty {}

message PublicParamsResponse {
    rbe.proto.PublicParams pp = 1;
}

message RegisterRequest {
    int64 id = 1;
    rbe.proto.G1 publicKey = 2;
    repeated rbe.proto.G1 xi = 3;
    string ip = 4;
    string port = 5;
    string token = 6;
}

message UserOpeningResponse {
    rbe.proto.G1 commitment = 1; 
    repeated rbe.proto.G1 opening = 2; 
    CounterAttestation counterAttestation = 3;
    rbe.proto.G1 proof = 4;
    repeated int64 usersBeforeMe = 5;
}

message UpdateRequest {
    int64 id = 1;
}

message Opening {
    repeated rbe.proto.G1 opening = 1;
}

message H1 {
    repeated rbe.proto.G1 h1 = 1;
}

message H2 {
    repeated rbe.proto.G2 H2 = 1;
}

message Commitments {
    repeated rbe.proto.G1 commitments = 1;
}

message AllUserOpenings {
    repeated Opening allOpenings = 1;
}

message AllUpdatesResponse {
    repeated rbe.proto.G1 allCommitments = 1;
    repeated Opening allOpenings = 2;
    repeated RegistrationEvent history = 3;
}

message RegistrationEvent {
    string token = 1;
    string ip = 2;
    string port = 3;
    int64 id = 4;
    rbe.proto.G1 publicKey = 5;
    repeated rbe.proto.G1 xi = 6;
    RegisterRequest request = 7;
    rbe.proto.G1 proof = 8;
    CounterAttestation counterAttestation = 9;
}

message CounterAttestation {
    uint64 counter = 1;
    bytes msgHash = 2;
    ECDSASignature signature = 3;
}

message ECDSASignature {
    bytes r = 1;
    bytes s = 2;
}

message StreamRegistrationsRequest {
    int64 subscriberId = 1;  // the subscriber's own RBE user ID
}

message RegistrationNotification {
    int64 id = 1;
    rbe.proto.G1 proof = 2;
    CounterAttestation counterAttestation = 3;
    bytes registerRequestBytes = 4;
}